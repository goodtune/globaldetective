<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Global Detective Quest{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root {
        --gd-gold:    #ffc107;
        --gd-dark:    #0f1117;
        --gd-darker:  #080b10;
        --gd-surface: #1a1f2e;
        --gd-border:  #2a3040;
        --gd-muted:   #8b92a5;
        --gd-text:    #dde1ea;
      }
      body {
        background: var(--gd-dark);
        color: var(--gd-text);
        font-family: 'Source Sans 3', system-ui, sans-serif;
        font-size: .95rem;
        min-height: 100vh;
      }
      .navbar {
        background: var(--gd-darker) !important;
        border-bottom: 1px solid var(--gd-border);
      }
      .navbar-brand {
        font-family: 'Special Elite', serif;
        font-size: 1.25rem;
        color: var(--gd-gold) !important;
        letter-spacing: .03em;
      }
      .nav-link { color: var(--gd-muted) !important; font-size: .875rem; }
      .nav-link:hover { color: var(--gd-text) !important; }
      .card {
        background: var(--gd-surface);
        border-color: var(--gd-border) !important;
        border-radius: .6rem;
        color: var(--gd-text);
      }
      .card-header {
        background: rgba(255,255,255,.04);
        border-bottom-color: var(--gd-border);
        font-size: .8rem;
        text-transform: uppercase;
        letter-spacing: .06em;
        color: var(--gd-muted);
        padding: .5rem .8rem;
      }
      .text-muted { color: var(--gd-muted) !important; }
      a { color: var(--gd-gold); }
      a:hover { color: #ffd454; }
    </style>
    {% block extra_css %}{% endblock %}
  </head>
  <body>
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand" href="{% url 'index' %}">🔍 Global Detective</a>
        <button class="navbar-toggler border-secondary" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="{% url 'dossiers:index' %}">Dossiers</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'factbook:index' %}">World Fact Book</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'game:index' %}">Play Game</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container my-4">
      {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
