name: global_detective
description: A Flutter-based detective game inspired by Carmen Sandiego
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  
  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  
  # HTTP and API
  dio: ^5.6.0
  json_annotation: ^4.9.0
  
  # UI Components
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  
  # Navigation
  go_router: ^14.2.7
  
  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  
  # Platform specific
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  
  # Code generation
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  
  # Testing
  bloc_test: ^9.1.7
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/data/
    - assets/audio/
    
  fonts:
    - family: Detective
      fonts:
        - asset: assets/fonts/detective_regular.ttf
        - asset: assets/fonts/detective_bold.ttf
          weight: 700